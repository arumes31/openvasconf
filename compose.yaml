name: openvasconf-development

services:
  openvasconf:
    build: .
    image: openvasconf:local
    restart: unless-stopped
    init: true
    user: "1001:1001"
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    ports:
      - "127.0.0.1:${OPENVASCONF_PORT:-8080}:8080"
    environment:
      OPENVASCONF_LISTEN: "0.0.0.0:8080"
      OPENVASCONF_DATABASE: "/data/openvasconf.db"
      OPENVASCONF_GMP_SOCKET: "/run/gvmd/gvmd.sock"
      OPENVASCONF_GMP_USERNAME: "${OPENVASCONF_GMP_USERNAME:-admin}"
      OPENVASCONF_GMP_PASSWORD_FILE: "/run/secrets/openvasconf_gmp_password"
      OPENVASCONF_ADMIN_PASSWORD_FILE: "/run/secrets/openvasconf_admin_password"
      OPENVASCONF_TIMEZONE: "${OPENVASCONF_TIMEZONE:-Europe/Vienna}"
    secrets:
      - openvasconf_admin_password
      - openvasconf_gmp_password
    volumes:
      - openvasconf_data:/data
      - gvmd_socket_vol:/run/gvmd

secrets:
  openvasconf_admin_password:
    file: ./secrets/admin_password
  openvasconf_gmp_password:
    file: ./secrets/gmp_password

volumes:
  openvasconf_data:
  gvmd_socket_vol:
    external: true
    name: greenbone-community-edition_gvmd_socket_vol
