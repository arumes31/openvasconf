name: Publish container

on:
  push:
    branches:
      - main
    tags:
      - v*.*.*
  release:
    types:
      - published
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate-ci:
    name: Required CI gate
    permissions:
      contents: read
    uses: ./.github/workflows/ci.yml

  validate-security:
    name: Required security gate
    permissions:
      actions: read # Resolve workflow metadata during SARIF upload.
      contents: read
      security-events: write # Publish CodeQL, gosec, and Trivy SARIF.
    uses: ./.github/workflows/security.yml

  validate-supply-chain:
    name: Required supply-chain gate
    permissions:
      actions: read # Let workflow security tools inspect action metadata.
      contents: read
      security-events: write # Publish zizmor SARIF before release evaluation.
    uses: ./.github/workflows/supply-chain.yml
    with:
      skip_scorecard: true

  publish:
    name: Build, attest, and sign
    needs:
      - validate-ci
      - validate-security
      - validate-supply-chain
    if: >-
      github.event_name == 'release' ||
      startsWith(github.ref, 'refs/tags/v') ||
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      actions: read # Resolve workflow metadata during SARIF upload.
      attestations: write # Store the image provenance attestation.
      contents: read
      id-token: write # Obtain keyless signing and attestation identities.
      packages: write # Push the image and registry-backed attestations to GHCR.
      security-events: write # Publish release-candidate Trivy SARIF.
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@05e31511f85b41b11d1cf0ef85d0992719546e2c # v2.21.0
        with:
          egress-policy: audit
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate publication reference
        if: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          tag="$REF_NAME"
          if [[ "$EVENT_NAME" == "release" ]]; then
            tag="$RELEASE_TAG"
          fi
          if [[ ! "$tag" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?(\+[0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*)?$ ]]; then
            printf 'Refusing to publish non-semver tag: %s\n' "$tag" >&2
            exit 1
          fi
      - name: Normalize image name
        id: image
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
        run: echo "name=ghcr.io/${REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ steps.image.outputs.name }}
          tags: |
            type=raw,value=edge,enable=${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
            type=sha,prefix=sha-,format=long
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') && (github.event_name != 'release' || !github.event.release.prerelease) && (startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release') }}
      - name: Build and push untagged image digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          labels: ${{ steps.metadata.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: mode=max
          sbom: true
          outputs: type=image,name=${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true,push=true
      - name: Attest image provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ steps.image.outputs.name }}
          subject-digest: ${{ steps.build.outputs.digest }}
          push-to-registry: true
          create-storage-record: false
      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign image digest with GitHub OIDC
        shell: bash
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ steps.image.outputs.name }}
        run: cosign sign --yes "${IMAGE}@${DIGEST}"
      - name: Verify keyless signature
        shell: bash
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ steps.image.outputs.name }}
          REPOSITORY: ${{ github.repository }}
        run: |
          cosign verify \
            --certificate-identity-regexp "^https://github.com/${REPOSITORY}/.github/workflows/container.yml@refs/(heads|tags)/.+$" \
            --certificate-oidc-issuer "https://token.actions.githubusercontent.com" \
            "${IMAGE}@${DIGEST}"
      - name: Scan amd64 release candidate
        id: trivy-amd64
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/amd64
        with:
          version: v0.73.0
          image-ref: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
          format: sarif
          output: trivy-release-amd64.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'
      - name: Scan arm64 release candidate
        id: trivy-arm64
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/arm64
        with:
          version: v0.73.0
          image-ref: ${{ steps.image.outputs.name }}@${{ steps.build.outputs.digest }}
          format: sarif
          output: trivy-release-arm64.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: '1'
      - name: Upload amd64 release SARIF
        if: ${{ always() && hashFiles('trivy-release-amd64.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          sarif_file: trivy-release-amd64.sarif
          category: trivy-release-amd64
      - name: Upload arm64 release SARIF
        if: ${{ always() && hashFiles('trivy-release-arm64.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@db488ddef3bf6cb639b32c2e9a7c0a7ea8271d28 # v4.37.8
        with:
          sarif_file: trivy-release-arm64.sarif
          category: trivy-release-arm64
      - name: Enforce release image scans
        if: ${{ always() && (steps.trivy-amd64.outcome == 'failure' || steps.trivy-arm64.outcome == 'failure') }}
        run: exit 1
      - name: Promote verified digest to public tags
        shell: bash
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ steps.image.outputs.name }}
          PUBLIC_TAGS: ${{ steps.metadata.outputs.tags }}
        run: |
          tag_args=()
          while IFS= read -r tag; do
            if [[ -n "$tag" ]]; then
              tag_args+=(--tag "$tag")
            fi
          done <<< "$PUBLIC_TAGS"
          if (( ${#tag_args[@]} == 0 )); then
            echo "No public tags were generated" >&2
            exit 1
          fi
          docker buildx imagetools create "${tag_args[@]}" "${IMAGE}@${DIGEST}"
      - name: Record published digest
        shell: bash
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          IMAGE: ${{ steps.image.outputs.name }}
        run: printf '%s@%s\n' "$IMAGE" "$DIGEST" > image-digest.txt
      - name: Upload image digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: image-digest
          path: image-digest.txt
          if-no-files-found: error
          retention-days: 30
