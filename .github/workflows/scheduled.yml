name: Weekly deep scan

on:
  schedule:
    - cron: '17 3 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: weekly-deep-scan
  cancel-in-progress: false

jobs:
  race-tests:
    name: Repeated race tests
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Run repeated race tests
        run: go test -race -shuffle=on -count=10 -timeout=35m ./...

  go-security:
    name: Weekly Go security scanners
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      actions: read # Resolve workflow metadata during SARIF upload.
      contents: read
      security-events: write # Publish weekly gosec SARIF.
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install Go security scanners
        shell: bash
        run: |
          go install github.com/securego/gosec/v2/cmd/gosec@7b1b5cebe007d62fb58eacb90fc571112939ec30
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          scanner_bin="$(go env GOBIN)"
          if [[ -z "$scanner_bin" ]]; then
            scanner_bin="$(go env GOPATH)/bin"
          fi
          echo "GO_SECURITY_BIN=$scanner_bin" >> "$GITHUB_ENV"
      - name: Run gosec
        id: gosec
        shell: bash
        run: |
          set +e
          "$GO_SECURITY_BIN/gosec" -fmt sarif -out gosec-weekly.sarif ./...
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Run govulncheck
        id: govulncheck
        shell: bash
        run: |
          set +e
          "$GO_SECURITY_BIN/govulncheck" -json ./... > govulncheck-weekly.json
          status=$?
          echo "status=$status" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload weekly gosec SARIF
        if: ${{ always() && hashFiles('gosec-weekly.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: gosec-weekly.sarif
          category: gosec-weekly
      - name: Upload weekly govulncheck report
        if: ${{ always() && hashFiles('govulncheck-weekly.json') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: govulncheck-weekly
          path: govulncheck-weekly.json
          if-no-files-found: error
          retention-days: 30
      - name: Enforce weekly Go security results
        if: ${{ always() && (steps.gosec.outputs.status != '0' || steps.govulncheck.outputs.status != '0') }}
        run: exit 1

  image-security:
    name: Weekly fresh-image scan
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      actions: read # Resolve workflow metadata during SARIF upload.
      contents: read
      security-events: write # Publish the weekly Trivy SARIF report.
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@ccd8616d44fd3846e67624a50d5aad6d37bf2d25 # v2.22.1
        with:
          egress-policy: audit
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build fresh image
        run: docker build --no-cache --tag openvasconf:weekly .
      - name: Scan fresh image
        id: trivy
        continue-on-error: true
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: v0.73.0
          image-ref: openvasconf:weekly
          format: sarif
          output: trivy-weekly.sarif
          severity: HIGH,CRITICAL
          limit-severities-for-sarif: true
          ignore-unfixed: false
          exit-code: '1'
      - name: Upload weekly SARIF
        if: ${{ always() && hashFiles('trivy-weekly.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@6f2ac81f5cd81fe351a197ba0b00d91d03cd2aee # v4.39.0
        with:
          sarif_file: trivy-weekly.sarif
          category: trivy-weekly-container
      - name: Enforce weekly Trivy result
        if: ${{ always() && steps.trivy.outcome == 'failure' }}
        run: exit 1
